<article class="prompt c-card">
  <header class="prompt__head">
    <p class="prompt__label">
      <span nz-icon nzType="robot" nzTheme="outline" aria-hidden="true"></span>
      <span>Prompt pentru asistent · {{ lineLabel() }}</span>
    </p>
    <app-copy-button [text]="text()" label="Copiază promptul" tone="c-btn--ink" />
  </header>

  <div class="prompt__body" [class.is-open]="expanded()">
    <pre id="prompt-text" tabindex="0" lang="en"><code>{{ text() }}</code></pre>
  </div>
  <div class="prompt__foot">
    <button type="button" class="c-btn c-btn--ghost c-btn--sm" [attr.aria-expanded]="expanded()" aria-controls="prompt-text" (click)="toggle()">
      <span nz-icon nzType="down" nzTheme="outline" class="prompt__chevron" [class.is-open]="expanded()" aria-hidden="true"></span>
      <span>{{ expanded() ? 'Restrânge' : 'Arată tot' }}</span>
    </button>
  </div>
</article>
