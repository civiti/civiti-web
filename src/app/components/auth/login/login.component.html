<app-auth-shell>
  <a authTop routerLink="/auth/register" class="auth-back">
    <span nz-icon nzType="arrow-left" nzTheme="outline" aria-hidden="true"></span>
    <span>Înapoi</span>
  </a>

  <nz-spin [nzSpinning]="(isLoading$ | async) || false">
    <header class="auth-head">
      <h1 class="auth-title">Bine ai revenit</h1>
      <p class="auth-lead">Conectează-te pentru a continua să faci diferența în comunitatea ta.</p>
    </header>

    @if (error$ | async; as error) {
      <div class="c-callout c-callout--bad auth-alert" role="alert">
        <span nz-icon nzType="exclamation-circle" nzTheme="outline" aria-hidden="true"></span>
        <p>{{ error }}</p>
        <button type="button" class="auth-alert__close" aria-label="Închide mesajul" (click)="clearError()">
          <span nz-icon nzType="close" nzTheme="outline" aria-hidden="true"></span>
        </button>
      </div>
    }

    <button
      nz-button
      nzSize="large"
      nzBlock
      type="button"
      (click)="loginWithGoogle()">
      <span nz-icon nzType="google" nzTheme="outline" aria-hidden="true"></span>
      <span>Continuă cu Google</span>
    </button>

    <p class="auth-or">sau conectează-te cu email</p>

    <form nz-form nzLayout="vertical" [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <nz-form-item>
        <nz-form-label nzFor="email" nzRequired>Adresă de email</nz-form-label>
        <nz-form-control nzErrorTip="Te rugăm să introduci o adresă de email validă">
          <input
            nz-input
            formControlName="email"
            id="email"
            type="email"
            inputmode="email"
            placeholder="nume@exemplu.ro"
            autocomplete="email">
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password" nzRequired>Parolă</nz-form-label>
        <nz-form-control nzErrorTip="Te rugăm să introduci parola">
          <nz-input-group [nzSuffix]="passwordSuffix">
            <input
              nz-input
              formControlName="password"
              id="password"
              [type]="passwordVisible ? 'text' : 'password'"
              placeholder="Introdu parola"
              autocomplete="current-password">
          </nz-input-group>
          <ng-template #passwordSuffix>
            <button
              type="button"
              class="auth-eye"
              [attr.aria-label]="passwordVisible ? 'Ascunde parola' : 'Arată parola'"
              [attr.aria-pressed]="passwordVisible"
              (click)="passwordVisible = !passwordVisible">
              <span nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'" nzTheme="outline" aria-hidden="true"></span>
            </button>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <div class="options">
        <label nz-checkbox formControlName="rememberMe">Ține-mă minte</label>
        <a routerLink="/auth/forgot-password" class="c-link">Ai uitat parola?</a>
      </div>

      <button
        nz-button
        nzType="primary"
        nzSize="large"
        nzBlock
        type="submit"
        [disabled]="!loginForm.valid">
        <span>Conectare</span>
        <span nz-icon nzType="arrow-right" nzTheme="outline" aria-hidden="true"></span>
      </button>
    </form>

    <p class="auth-alt">
      Nu ai încă un cont?
      <a routerLink="/auth/register" class="c-link">Creează un cont</a>
    </p>
  </nz-spin>
</app-auth-shell>
