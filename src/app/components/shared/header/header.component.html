<header class="site-header" (keydown.escape)="closeMenu()">
  <div class="c-container bar">
    <a class="brand" routerLink="/" aria-label="Civiti — pagina principală">
      <img src="/images/logo/civiti-mark.svg" alt="" width="32" height="32" />
      <span class="brand-word">Civiti</span>
    </a>

    <nav class="primary-nav" aria-label="Navigație principală">
      <a routerLink="/bucuresti" routerLinkActive="is-active">Probleme</a>
      <a routerLink="/ghid" routerLinkActive="is-active">Ghid civic</a>
      <a routerLink="/despre" routerLinkActive="is-active">Despre</a>
    </nav>

    <div class="actions">
      <a class="c-btn c-btn--signal report" routerLink="/create-issue">
        <span nz-icon nzType="plus" nzTheme="outline" aria-hidden="true"></span>
        <span>Raportează</span>
      </a>

      <app-auth-buttons class="account" [showAdminLink]="true" />

      <button
        type="button"
        class="c-btn c-btn--ghost c-btn--icon menu-toggle"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="site-menu"
        [attr.aria-label]="menuOpen() ? 'Închide meniul' : 'Deschide meniul'"
        (click)="toggleMenu()">
        <span nz-icon [nzType]="menuOpen() ? 'close' : 'menu'" nzTheme="outline" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div id="site-menu" class="menu-panel">
      <nav class="c-container menu-inner" aria-label="Meniu">
        <a routerLink="/bucuresti" routerLinkActive="is-active">
          <span nz-icon nzType="unordered-list" nzTheme="outline" aria-hidden="true"></span>
          <span>Probleme din București</span>
        </a>
        <a routerLink="/ghid" routerLinkActive="is-active">
          <span nz-icon nzType="read" nzTheme="outline" aria-hidden="true"></span>
          <span>Ghid civic</span>
        </a>
        <a routerLink="/despre" routerLinkActive="is-active">
          <span nz-icon nzType="info-circle" nzTheme="outline" aria-hidden="true"></span>
          <span>Despre Civiti</span>
        </a>

        <hr class="menu-rule" />

        @if (isAuthenticated()) {
          <a routerLink="/dashboard" routerLinkActive="is-active">
            <span nz-icon nzType="dashboard" nzTheme="outline" aria-hidden="true"></span>
            <span>Panoul meu</span>
          </a>
          <a routerLink="/my-issues" routerLinkActive="is-active">
            <span nz-icon nzType="file-text" nzTheme="outline" aria-hidden="true"></span>
            <span>Problemele mele</span>
          </a>
          @if (canAccessAdmin()) {
            <a routerLink="/admin" routerLinkActive="is-active">
              <span nz-icon nzType="setting" nzTheme="outline" aria-hidden="true"></span>
              <span>Administrare</span>
            </a>
          }
          <button type="button" (click)="logout()">
            <span nz-icon nzType="logout" nzTheme="outline" aria-hidden="true"></span>
            <span>Deconectare</span>
          </button>
        } @else {
          <div class="menu-auth">
            <button type="button" class="c-btn c-btn--outline" (click)="login()">
              <span>Intră în cont</span>
            </button>
            <button type="button" class="c-btn c-btn--ink" (click)="register()">
              <span>Creează cont</span>
            </button>
          </div>
        }
      </nav>
    </div>
  }

  @if (showBackButton()) {
    <div class="context">
      <div class="c-container context-inner">
        <button type="button" class="back" (click)="onBack()">
          <span nz-icon nzType="arrow-left" nzTheme="outline" aria-hidden="true"></span>
          <span>Înapoi</span>
        </button>
        <span class="context-sep" aria-hidden="true"></span>
        <span class="context-title">{{ title() }}</span>
        @if (subtitle()) {
          <span class="context-sub">{{ subtitle() }}</span>
        }
      </div>
    </div>
  }
</header>
